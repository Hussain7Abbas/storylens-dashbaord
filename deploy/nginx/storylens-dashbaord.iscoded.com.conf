# Static single-page dashboard; the API lives at storylens-api.iscoded.com.
server {
    listen 80;
    listen [::]:80;
    server_name storylens-dashbaord.iscoded.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storylens-dashbaord.iscoded.com;
    ssl_certificate /etc/letsencrypt/live/storylens-dashbaord.iscoded.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storylens-dashbaord.iscoded.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/storylens-dashbaord/current;
    index index.html;
    access_log /var/log/nginx/storylens-dashbaord.access.log;
    error_log /var/log/nginx/storylens-dashbaord.error.log;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits no inline scripts or styles; images come from the API's image host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://storylens-api.iscoded.com http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    # Client-side routes fall back to the app shell, which must not be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://storylens-api.iscoded.com http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri /index.html;
    }
    location ~ /\.(?!well-known) { deny all; }
}
